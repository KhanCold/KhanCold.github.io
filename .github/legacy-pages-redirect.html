<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=https://khancold.github.io/" />
    <link rel="canonical" href="https://khancold.github.io/" />
    <title>Redirecting to Qiming Shi's homepage</title>
    <script>
      const destination = new URL("https://khancold.github.io/");
      destination.search = window.location.search;
      destination.hash = window.location.hash;
      window.location.replace(destination.toString());
    </script>
  </head>
  <body>
    <p>
      This homepage has moved to
      <a href="https://khancold.github.io/">khancold.github.io</a>.
    </p>
  </body>
</html>
